services:
  - type: web
    name: ha-overseas-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # DEP-01: src/utils/token.js reads JWT_REFRESH_SECRET for refresh
      # tokens and throws in production when it is missing/short.
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # DEP-01: src/utils/token.js actually reads JWT_ACCESS_EXPIRES_IN
      # (access tokens) and JWT_REFRESH_EXPIRES_IN (refresh tokens).
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      # DEP-01: src/middleware/internalAuth.js reads INTERNAL_API_KEY
      # for service-to-service routes.
      - key: INTERNAL_API_KEY
        sync: false
      # DEP-01: src/utils/emailService.js reads SMTP_HOST / SMTP_USER /
      # SMTP_PASS (plus SMTP_PORT / SMTP_SECURE) and sends from
      # EMAIL_FROM; SMTP_FROM is provisioned alongside the SMTP_* set.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: admin@haoverseas.com
      - key: FIREBASE_PROJECT_ID
        sync: false
      # FEAT-11 (v0.8): src/services/messaging.js activates the Meta
      # WhatsApp Cloud API adapter only when BOTH are set; otherwise
      # WhatsApp sends are recorded as 'simulated' in MessageLog.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
